<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ÖSD Almanca Kelime Öğrenme Sistemi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F6F5EF;
    --surface:#FFFFFF;
    --surface-2:#EFEDE3;
    --ink:#232A25;
    --ink-soft:#6B7570;
    --line:#E3E0D2;
    --teal:#1F7A6C;
    --teal-dark:#155A50;
    --teal-tint:#E4F1EC;
    --amber:#E29A3B;
    --amber-tint:#FBEEDA;
    --coral:#D96C4F;
    --coral-tint:#FBEAE4;
    --green:#3F9142;
    --green-tint:#E7F3E4;
    --radius:18px;
    --shadow: 0 1px 2px rgba(35,42,37,0.04), 0 8px 24px rgba(35,42,37,0.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  #app{max-width:760px;margin:0 auto;padding:20px 16px 64px;}
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--teal-dark);
    font-weight:600;
  }
  h1,h2,h3{font-family:'Fraunces',serif; margin:0; font-weight:600;}
  .top{
    display:flex;align-items:center;justify-content:space-between;
    padding:6px 2px 22px;
  }
  .brand{display:flex;flex-direction:column;gap:3px;}
  .brand h1{font-size:20px;letter-spacing:-.01em;}
  .reset-btn{
    background:none;border:1px solid var(--line);color:var(--ink-soft);
    font-family:'Inter';font-size:12px;padding:7px 12px;border-radius:999px;cursor:pointer;
  }
  .reset-btn:hover{border-color:var(--coral);color:var(--coral);}

  /* ---- Module path (module list) ---- */
  .path{position:relative;padding:8px 0 8px 34px;}
  .path::before{
    content:'';position:absolute;left:15px;top:26px;bottom:26px;width:2px;
    background:repeating-linear-gradient(to bottom, var(--line) 0 6px, transparent 6px 12px);
  }
  .node{position:relative;display:flex;gap:16px;align-items:flex-start;margin-bottom:14px;}
  .node-dot{
    position:absolute;left:-34px;top:2px;width:32px;height:32px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-family:'IBM Plex Mono';font-size:12px;font-weight:600;
    background:var(--surface);border:2px solid var(--line);color:var(--ink-soft);
    z-index:1;
  }
  .node-dot.done{background:var(--teal);border-color:var(--teal);color:#fff;}
  .node-dot.current{background:var(--amber-tint);border-color:var(--amber);color:var(--amber);}
  .card-module{
    flex:1;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px 16px;box-shadow:var(--shadow);cursor:pointer;transition:transform .12s ease;
  }
  .card-module.locked{opacity:.5;cursor:not-allowed;}
  .card-module:not(.locked):hover{transform:translateY(-1px);}
  .card-module-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
  .card-module h3{font-size:16px;}
  .card-module .cat{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .progress-track{height:5px;background:var(--surface-2);border-radius:99px;margin-top:10px;overflow:hidden;}
  .progress-fill{height:100%;background:var(--teal);border-radius:99px;}
  .pill{
    font-family:'IBM Plex Mono';font-size:11px;color:var(--ink-soft);
    background:var(--surface-2);padding:2px 8px;border-radius:99px;white-space:nowrap;
  }
  .pill.done{background:var(--green-tint);color:var(--green);}

  /* ---- Lesson header / progress ---- */
  .lesson-head{margin-bottom:18px;}
  .lesson-head-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .back-link{font-size:13px;color:var(--ink-soft);cursor:pointer;text-decoration:none;}
  .back-link:hover{color:var(--teal-dark);}
  .stage-badge{
    font-family:'IBM Plex Mono';font-size:11px;font-weight:600;letter-spacing:.06em;
    background:var(--teal-tint);color:var(--teal-dark);padding:4px 10px;border-radius:99px;
  }
  .rep-track{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;}
  .rep-fill{height:100%;background:linear-gradient(90deg,var(--teal),var(--amber));border-radius:99px;transition:width .3s ease;}
  .lesson-title{font-size:22px;margin-top:10px;}

  /* ---- Generic stage card ---- */
  .stage-card{
    background:var(--surface);border:1px solid var(--line);border-radius:24px;
    padding:32px 24px;box-shadow:var(--shadow);text-align:center;min-height:260px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  }
  .word-de{font-family:'Fraunces',serif;font-size:38px;font-weight:600;letter-spacing:-.01em;}
  .word-tr{font-size:19px;color:var(--teal-dark);font-weight:500;}
  .divider-line{width:36px;height:2px;background:var(--amber);border-radius:2px;}

  /* focus ring for HÖM */
  .ring-wrap{position:relative;width:150px;height:150px;margin:0 auto 6px;}
  .ring-wrap svg{transform:rotate(-90deg);}
  .ring-bg{fill:none;stroke:var(--surface-2);stroke-width:6;}
  .ring-fg{fill:none;stroke:var(--amber);stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset .1s linear;}
  .ring-center{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  }

  .btn{
    font-family:'Inter';font-weight:600;font-size:14px;border:none;border-radius:12px;
    padding:12px 22px;cursor:pointer;transition:transform .08s ease, background .15s ease;
  }
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--teal);color:#fff;}
  .btn-primary:hover{background:var(--teal-dark);}
  .btn-ghost{background:var(--surface-2);color:var(--ink);}
  .btn-ghost:hover{background:var(--line);}
  .btn-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}

  .input-row{display:flex;gap:8px;width:100%;max-width:340px;}
  input[type=text]{
    flex:1;font-family:'Inter';font-size:16px;padding:12px 14px;border-radius:12px;
    border:1.5px solid var(--line);background:var(--bg);color:var(--ink);
  }
  input[type=text]:focus{outline:none;border-color:var(--teal);}
  .feedback{font-size:14px;font-weight:600;min-height:20px;}
  .feedback.ok{color:var(--green);}
  .feedback.bad{color:var(--coral);}
  .hint{font-size:12px;color:var(--ink-soft);}

  /* match grid */
  .match-grid{display:flex;gap:14px;width:100%;justify-content:center;}
  .match-col{display:flex;flex-direction:column;gap:8px;flex:1;max-width:280px;}
  .match-tile{
    background:var(--surface-2);border:1.5px solid transparent;border-radius:10px;padding:10px 12px;
    font-size:14px;cursor:pointer;text-align:left;transition:all .12s ease;
  }
  .match-tile.selected{border-color:var(--amber);background:var(--amber-tint);}
  .match-tile.correct{border-color:var(--green);background:var(--green-tint);color:var(--green);cursor:default;}
  .match-tile.wrong{border-color:var(--coral);background:var(--coral-tint);}
  .match-tile.hidden-match{visibility:hidden;}

  .mc-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:420px;}
  .mc-opt{
    background:var(--surface-2);border:1.5px solid transparent;border-radius:12px;padding:12px 10px;
    font-size:14px;cursor:pointer;text-align:center;
  }
  .mc-opt.correct{border-color:var(--green);background:var(--green-tint);color:var(--green);}
  .mc-opt.wrong{border-color:var(--coral);background:var(--coral-tint);color:var(--coral);}
  .mc-opt.disabled{cursor:default;}

  .example-block{width:100%;text-align:left;background:var(--surface-2);border-radius:14px;padding:16px 18px;}
  .example-de{font-family:'Fraunces',serif;font-size:19px;margin-bottom:4px;}
  .example-tr{font-size:14px;color:var(--ink-soft);}

  .counter{font-family:'IBM Plex Mono';font-size:12px;color:var(--ink-soft);}
  .score-tag{font-family:'IBM Plex Mono';font-size:13px;font-weight:600;}

  .complete-wrap{text-align:center;padding:50px 16px;}
  .complete-wrap h2{font-size:26px;margin-bottom:8px;}
  .complete-wrap p{color:var(--ink-soft);font-size:14px;margin-bottom:20px;}

  .empty-note{text-align:center;color:var(--ink-soft);font-size:13px;padding:30px 0;}
  @media (max-width:480px){
    .word-de{font-size:30px;}
    .mc-grid{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =========================================================
   VERİ MODELİ: Kelimeler ve modüller tamamen kullanıcı
   tarafından eklenir/silinir. Uygulama içinde hazır kelime
   listesi yoktur; her modüle en fazla 13 kelime eklenebilir.
   ========================================================= */
const MAX_WORDS_PER_MODULE = 13;
let MODULES = []; // [{id, words:[{de, tr:[...]}]}]

function exampleFor(w){
  return ["Ich möchte oft "+w.de+".", "Sık sık "+(w.tr[0]||'')+" istiyorum."];
}

function newModuleId(){ return 'm'+Date.now()+Math.floor(Math.random()*10000); }

const STAGE_TYPES = ['HÖM','TAHMİN','TERS','EŞLEŞTİRME','BOŞLUK DOLDURMA','ÖRNEKLER','MİNİ TEST'];
const REPS = 14;
const STEPS_PER_MODULE = STAGE_TYPES.length * REPS; // 98

/* =========================================================
   YARDIMCI FONKSİYONLAR
   ========================================================= */
function seededRandom(seed){
  let s = seed % 2147483647; if(s<=0) s += 2147483646;
  return function(){ s = (s*16807) % 2147483647; return (s-1)/2147483646; };
}
function seededShuffle(arr, seed){
  const rnd = seededRandom(seed+1);
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(rnd()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function normalizeTr(str){
  return (str||'')
    .toLocaleLowerCase('tr')
    .replace(/-/g,' ')
    .replace(/[().,;:!?'"]/g,'')
    .replace(/\s+/g,' ')
    .trim();
}
function normalizeDe(str){
  return (str||'').toLocaleLowerCase('de').trim();
}
function isCorrectTr(input, acceptedList){
  const n = normalizeTr(input);
  if(!n) return false;
  return acceptedList.some(a => normalizeTr(a)===n);
}

/* =========================================================
   KALICI DEPOLAMA — güvenli sarmalayıcı
   Öncelik: window.storage (Claude içi) → localStorage (GitHub
   Pages / normal web barındırma) → bellek içi yedek.
   ========================================================= */
const memFallback = {};
function hasClaudeStorage(){ return typeof window!=='undefined' && !!window.storage; }
function hasLocalStorage(){
  try{
    if(typeof window==='undefined' || !window.localStorage) return false;
    const t='__osd_test__'; window.localStorage.setItem(t,'1'); window.localStorage.removeItem(t);
    return true;
  }catch(e){ return false; }
}
async function storeGet(key){
  try{
    if(hasClaudeStorage()){
      const r = await window.storage.get(key, false);
      return r ? JSON.parse(r.value) : null;
    }
  }catch(e){ /* devam et, diğer yöntemleri dene */ }
  try{
    if(hasLocalStorage()){
      const v = window.localStorage.getItem('osd:'+key);
      return v ? JSON.parse(v) : null;
    }
  }catch(e){ /* devam et */ }
  return memFallback[key] !== undefined ? memFallback[key] : null;
}
async function storeSet(key, value){
  memFallback[key] = value;
  try{
    if(hasClaudeStorage()){ await window.storage.set(key, JSON.stringify(value), false); return; }
  }catch(e){ /* localStorage'a düş */ }
  try{
    if(hasLocalStorage()){ window.localStorage.setItem('osd:'+key, JSON.stringify(value)); return; }
  }catch(e){ /* sadece bellekte kalır */ }
}
async function storeDelete(key){
  delete memFallback[key];
  try{ if(hasClaudeStorage()) await window.storage.delete(key, false); }catch(e){}
  try{ if(hasLocalStorage()) window.localStorage.removeItem('osd:'+key); }catch(e){}
}

/* =========================================================
   UYGULAMA DURUMU
   ========================================================= */
let PROGRESS = null; // { m0:{step:0, done:false}, ... }
let SCREEN = 'loading'; // loading | list | edit | lesson | modulecomplete
let CUR_MODULE = 0;
let EDIT_MODULE = 0;
let session = null; // aktif ders adımı için geçici durum
let activeTimer = null;

function clearActiveTimer(){ if(activeTimer){ clearInterval(activeTimer); activeTimer=null; } }

function defaultProgress(){
  const p = {};
  MODULES.forEach(m=> p[m.id] = {step:0, done:false});
  return p;
}

async function loadProgress(){
  const saved = await storeGet('osd_data_v2');
  if(saved && Array.isArray(saved.modules)){
    MODULES = saved.modules;
    PROGRESS = saved.progress || {};
  } else {
    MODULES = [];
    PROGRESS = {};
  }
  MODULES.forEach(m=>{ if(!PROGRESS[m.id]) PROGRESS[m.id] = {step:0, done:false}; });
}
async function saveProgress(){ await storeSet('osd_data_v2', {modules:MODULES, progress:PROGRESS}); }

function isUnlocked(idx){
  return true; // tüm modüllerin kilidi kaldırıldı
}

/* ---- Modül ve kelime yönetimi (kullanıcı kontrollü) ---- */
async function addModule(){
  const id = newModuleId();
  MODULES.push({id, words:[]});
  PROGRESS[id] = {step:0, done:false};
  await saveProgress();
  EDIT_MODULE = MODULES.length-1;
  SCREEN = 'edit';
  render();
}
async function deleteModule(idx){
  const m = MODULES[idx];
  if(!confirm('"Modül '+(idx+1)+'" ve içindeki tüm kelimeler silinsin mi?')) return;
  delete PROGRESS[m.id];
  MODULES.splice(idx,1);
  await saveProgress();
  SCREEN='list';
  render();
}
async function addWordToModule(idx, de, trRaw){
  const m = MODULES[idx];
  if(!m) return;
  if(m.words.length >= MAX_WORDS_PER_MODULE){ alert('Bu modülde en fazla '+MAX_WORDS_PER_MODULE+' kelime olabilir.'); return; }
  de = (de||'').trim();
  const tr = (trRaw||'').split(',').map(s=>s.trim()).filter(Boolean);
  if(!de || tr.length===0){ alert('Lütfen hem Almanca hem Türkçe alanını doldur.'); return; }
  m.words.push({de, tr});
  await saveProgress();
  render();
}
async function removeWordFromModule(idx, wordIdx){
  const m = MODULES[idx];
  if(!m) return;
  m.words.splice(wordIdx,1);
  await saveProgress();
  render();
}

/* =========================================================
   RENDER: KÖK
   ========================================================= */
const root = document.getElementById('app');

function render(){
  clearActiveTimer();
  if(SCREEN==='loading'){ root.innerHTML = '<div class="empty-note">Yükleniyor...</div>'; return; }
  if(SCREEN==='list'){ root.innerHTML = renderList(); attachListEvents(); return; }
  if(SCREEN==='edit'){ root.innerHTML = renderEdit(); attachEditEvents(); return; }
  if(SCREEN==='lesson'){ root.innerHTML = renderLesson(); attachLessonEvents(); return; }
  if(SCREEN==='modulecomplete'){ root.innerHTML = renderModuleComplete(); attachCompleteEvents(); return; }
}

/* ---------------- MODÜL LİSTESİ ---------------- */
function renderList(){
  let html = `
  <div class="top">
    <div class="brand">
      <span class="eyebrow">ÖSD · A1 - A2 - B1 - B2 - C1</span>
      <h1>Almanca Kelime Öğrenme Sistemi</h1>
    </div>
    <button class="reset-btn" id="resetBtn">İlerlemeyi sıfırla</button>
  </div>
  <div class="path">`;
  MODULES.forEach((m,idx)=>{
    const prog = PROGRESS[m.id];
    const pct = Math.round((prog.step/STEPS_PER_MODULE)*100);
    const dotClass = prog.done ? 'done' : 'current';
    const dotContent = prog.done ? '✓' : (idx+1);
    const hasWords = m.words.length>0;
    html += `
    <div class="node">
      <div class="node-dot ${dotClass}">${dotContent}</div>
      <div class="card-module">
        <div class="card-module-top">
          <h3>Modül ${idx+1}</h3>
          <div style="display:flex;gap:6px;align-items:center;">
            ${prog.done ? '<span class="pill done">tamamlandı</span>' : `<span class="pill">${prog.step}/${STEPS_PER_MODULE}</span>`}
            <button class="reset-btn" style="padding:4px 9px;" data-del="${idx}" title="Modülü sil">− sil</button>
          </div>
        </div>
        <div class="cat">${m.words.length}/${MAX_WORDS_PER_MODULE} kelime</div>
        <div class="progress-track"><div class="progress-fill" style="width:${prog.done?100:pct}%"></div></div>
        <div class="btn-row" style="justify-content:flex-start;margin-top:12px;">
          <button class="btn btn-ghost" data-edit="${idx}" style="padding:8px 14px;font-size:13px;">✎ Kelimeleri düzenle</button>
          <button class="btn btn-primary" data-start="${idx}" style="padding:8px 14px;font-size:13px;" ${hasWords?'':'disabled'}>▶ Derse başla</button>
        </div>
      </div>
    </div>`;
  });
  html += `</div>
  <div class="btn-row" style="margin:18px 0 8px;">
    <button class="btn btn-primary" id="addModBtn">+ Modül ekle</button>
  </div>
  <p class="empty-note">${MODULES.length===0 ? 'Henüz modül yok — başlamak için "+ Modül ekle" butonuna dokun, ardından kelimelerini gir.' : 'Her modüle en fazla '+MAX_WORDS_PER_MODULE+' kelime ekleyebilirsin. Her modül 7 alıştırma türünden oluşan döngüyü 14 kez farklı formatlarla tekrarlar.'}</p>`;
  return html;
}
function attachListEvents(){
  const reset = document.getElementById('resetBtn');
  if(reset) reset.onclick = async ()=>{
    if(confirm('Tüm ilerleme (kelimeler kalır) sıfırlansın mı?')){
      PROGRESS = defaultProgress();
      await saveProgress();
      render();
    }
  };
  const addBtn = document.getElementById('addModBtn');
  if(addBtn) addBtn.onclick = ()=> addModule();
  document.querySelectorAll('[data-start]').forEach(el=>{
    el.onclick = ()=>{
      const idx = parseInt(el.dataset.start,10);
      CUR_MODULE = idx;
      startStep();
    };
  });
  document.querySelectorAll('[data-edit]').forEach(el=>{
    el.onclick = ()=>{
      EDIT_MODULE = parseInt(el.dataset.edit,10);
      SCREEN = 'edit';
      render();
    };
  });
  document.querySelectorAll('[data-del]').forEach(el=>{
    el.onclick = (e)=>{ e.stopPropagation(); deleteModule(parseInt(el.dataset.del,10)); };
  });
}

/* ---------------- KELİME DÜZENLEME EKRANI ---------------- */
function renderEdit(){
  const m = MODULES[EDIT_MODULE];
  if(!m){ return '<div class="empty-note">Modül bulunamadı.</div>'; }
  const full = m.words.length >= MAX_WORDS_PER_MODULE;
  let rows = m.words.map((w,i)=>`
    <div class="example-block" style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px;">
      <div>
        <div class="example-de" style="font-size:16px;">${w.de}</div>
        <div class="example-tr">${w.tr.join(' / ')}</div>
      </div>
      <button class="reset-btn" data-rm="${i}">− sil</button>
    </div>`).join('');
  if(!rows) rows = '<p class="empty-note">Bu modülde henüz kelime yok. Aşağıdan ekleyebilirsin.</p>';
  return `
  <div class="lesson-head">
    <div class="lesson-head-row">
      <span class="back-link" id="backBtn">← Modüller</span>
      <span class="stage-badge">Modül ${EDIT_MODULE+1} · ${m.words.length}/${MAX_WORDS_PER_MODULE}</span>
    </div>
    <h2 class="lesson-title" style="font-size:20px;">Kelimeleri düzenle</h2>
  </div>
  <div>${rows}</div>
  ${full ? '<p class="empty-note">Bu modül maksimum kelime sayısına ulaştı.</p>' : `
  <div class="stage-card" style="align-items:stretch;text-align:left;">
    <span class="hint">Yeni kelime ekle</span>
    <div class="input-row" style="max-width:none;">
      <input type="text" id="newDe" placeholder="Almanca (örn. kaufen)">
    </div>
    <div class="input-row" style="max-width:none;">
      <input type="text" id="newTr" placeholder="Türkçe anlam(lar), virgülle ayır (örn. satın almak)">
    </div>
    <div class="btn-row" style="justify-content:flex-start;">
      <button class="btn btn-primary" id="addWordBtn">+ Ekle</button>
    </div>
  </div>`}
  `;
}
function attachEditEvents(){
  const back = document.getElementById('backBtn');
  if(back) back.onclick = goList;
  document.querySelectorAll('[data-rm]').forEach(el=>{
    el.onclick = ()=> removeWordFromModule(EDIT_MODULE, parseInt(el.dataset.rm,10));
  });
  const addBtn = document.getElementById('addWordBtn');
  const deInp = document.getElementById('newDe');
  const trInp = document.getElementById('newTr');
  const submit = ()=>{
    addWordToModule(EDIT_MODULE, deInp.value, trInp.value);
  };
  if(addBtn) addBtn.onclick = submit;
  [deInp, trInp].forEach(inp=>{
    if(inp) inp.onkeydown = (e)=>{ if(e.key==='Enter'){ e.preventDefault(); submit(); } };
  });
}

/* ---------------- DERS EKRANI ---------------- */
function startStep(){
  const mod = MODULES[CUR_MODULE];
  if(!mod || mod.words.length===0){ alert('Bu modülde henüz kelime yok. Önce kelime ekle.'); SCREEN='list'; render(); return; }
  const prog = PROGRESS[mod.id];
  let step = prog.step;
  if(step >= STEPS_PER_MODULE) step = STEPS_PER_MODULE - 1; // güvenlik
  const stageType = step % STAGE_TYPES.length;
  const rep = Math.floor(step / STAGE_TYPES.length); // 0..13
  const seed = step*7+13;
  const order = seededShuffle(mod.words, seed);
  session = {
    mod, step, stageType, rep, seed, order,
    idx:0, correctCount:0, wrongCount:0,
    inputVal:'', feedback:null, feedbackType:null,
    selectedLeft:null, matched:[], leftShuffled:null, rightShuffled:null,
    mcSelected:null, mcResolved:false, mcOptions:null, mcCorrectIdx:null,
    testAnswers:[]
  };
  SCREEN = 'lesson';
  render();
}

function renderLesson(){
  const s = session;
  const overallStep = s.step; // 0-based
  const pct = Math.round(((overallStep)/STEPS_PER_MODULE)*100);
  let head = `
  <div class="lesson-head">
    <div class="lesson-head-row">
      <span class="back-link" id="backBtn">← Modüller</span>
      <span class="stage-badge">${STAGE_TYPES[s.stageType]}</span>
    </div>
    <div class="rep-track"><div class="rep-fill" style="width:${pct}%"></div></div>
    <div style="display:flex;justify-content:space-between;margin-top:6px;">
      <span class="counter">Modül ${CUR_MODULE+1} · Tekrar ${s.rep+1}/14</span>
      <span class="counter">${overallStep}/${STEPS_PER_MODULE}</span>
    </div>
  </div>`;
  let body = '';
  switch(STAGE_TYPES[s.stageType]){
    case 'HÖM': body = renderHOM(s); break;
    case 'TAHMİN': body = renderGuess(s, s.rep%2===0 ? 'de2tr' : 'tr2de'); break;
    case 'TERS': body = renderGuess(s, s.rep%2===0 ? 'tr2de' : 'de2tr'); break;
    case 'EŞLEŞTİRME': body = renderMatch(s); break;
    case 'BOŞLUK DOLDURMA': body = renderCloze(s); break;
    case 'ÖRNEKLER': body = renderExamples(s); break;
    case 'MİNİ TEST': body = renderMiniTest(s); break;
  }
  return head + body;
}

function goList(){ SCREEN='list'; session=null; render(); }

async function completeStep(){
  const mod = session.mod;
  const prog = PROGRESS[mod.id];
  prog.step = Math.min(prog.step+1, STEPS_PER_MODULE);
  if(prog.step >= STEPS_PER_MODULE) prog.done = true;
  await saveProgress();
  if(prog.done){ SCREEN='modulecomplete'; render(); }
  else { startStep(); }
}

/* ---- HÖM: hızlı hafıza kartı, zamanlayıcılı ---- */
function renderHOM(s){
  const words = s.order;
  const w = words[s.idx];
  const isLast = s.idx >= words.length-1;
  return `
  <div class="stage-card">
    <span class="hint">Kartı odakla, kelime ve anlamı hafızana kazı</span>
    <div class="ring-wrap">
      <svg width="150" height="150" viewBox="0 0 150 150">
        <circle class="ring-bg" cx="75" cy="75" r="66"></circle>
        <circle class="ring-fg" id="ringFg" cx="75" cy="75" r="66" stroke-dasharray="415" stroke-dashoffset="0"></circle>
      </svg>
      <div class="ring-center">
        <div class="word-de" style="font-size:26px">${w.de}</div>
        <div class="word-tr" style="font-size:15px">${w.tr[0]}</div>
      </div>
    </div>
    <div class="counter">${s.idx+1} / ${words.length}</div>
    <div class="btn-row">
      <button class="btn btn-ghost" id="homSkip">${isLast?'Bitir':'Sonrakine geç'}</button>
    </div>
  </div>`;
}
function attachHOM(){
  const dur = 2600;
  const circumference = 415;
  let start = Date.now();
  const ring = document.getElementById('ringFg');
  const step = ()=>{
    const elapsed = Date.now()-start;
    const frac = Math.min(elapsed/dur,1);
    if(ring) ring.setAttribute('stroke-dashoffset', String(circumference*frac));
    if(frac>=1){ advanceHOM(); }
  };
  activeTimer = setInterval(step, 60);
  const skip = document.getElementById('homSkip');
  if(skip) skip.onclick = ()=> advanceHOM();
}
function advanceHOM(){
  clearActiveTimer();
  const words = session.order;
  if(session.idx >= words.length-1){ completeStep(); return; }
  session.idx += 1;
  render();
}

/* ---- TAHMİN / TERS: yazarak cevap ---- */
function renderGuess(s, mode){
  const words = s.order;
  if(s.idx >= words.length){
    return renderPassSummary(s);
  }
  const w = words[s.idx];
  const prompt = mode==='de2tr' ? w.de : w.tr[0];
  const dirLabel = mode==='de2tr' ? 'Almancasını gördün, Türkçesini yaz' : 'Türkçesini gördün, Almancasını yaz';
  return `
  <div class="stage-card">
    <span class="hint">${dirLabel}</span>
    <div class="word-de">${prompt}</div>
    <div class="input-row">
      <input type="text" id="guessInput" autocomplete="off" placeholder="Cevabını yaz..." value="${s.inputVal||''}" ${s.feedback?'disabled':''}>
    </div>
    <div class="feedback ${s.feedbackType||''}">${s.feedback||''}</div>
    <div class="btn-row">
      ${s.feedback ? '<button class="btn btn-primary" id="guessNext">Devam et</button>' : '<button class="btn btn-primary" id="guessCheck">Kontrol et</button>'}
    </div>
    <div class="counter">${s.idx+1} / ${words.length} &nbsp;·&nbsp; Doğru: ${s.correctCount}</div>
  </div>`;
}
function attachGuess(mode){
  const input = document.getElementById('guessInput');
  if(input){
    input.focus();
    input.oninput = (e)=>{ session.inputVal = e.target.value; };
    input.onkeydown = (e)=>{ if(e.key==='Enter'){ e.preventDefault(); checkGuess(mode); } };
  }
  const chk = document.getElementById('guessCheck');
  if(chk) chk.onclick = ()=> checkGuess(mode);
  const nxt = document.getElementById('guessNext');
  if(nxt) nxt.onclick = ()=> nextGuess();
}
function checkGuess(mode){
  const s = session;
  const w = s.order[s.idx];
  let correct, correctAnswer;
  if(mode==='de2tr'){
    correct = isCorrectTr(s.inputVal, w.tr);
    correctAnswer = w.tr.join(' / ');
  } else {
    correct = normalizeDe(s.inputVal)===normalizeDe(w.de);
    correctAnswer = w.de;
  }
  if(correct){
    s.correctCount++;
    s.feedback = 'Doğru! ✓';
    s.feedbackType = 'ok';
  } else {
    s.wrongCount++;
    s.feedback = 'Doğru cevap: '+correctAnswer;
    s.feedbackType = 'bad';
  }
  render();
}
function nextGuess(){
  session.idx++; session.inputVal=''; session.feedback=null; session.feedbackType=null;
  render();
}
function renderPassSummary(s){
  const total = s.order.length;
  const pct = Math.round((s.correctCount/total)*100);
  return `
  <div class="stage-card">
    <h2 style="font-size:22px;">Bu geçiş tamam</h2>
    <div class="score-tag" style="color:${pct>=70?'var(--green)':'var(--coral)'}">${s.correctCount}/${total} doğru (%${pct})</div>
    <div class="btn-row"><button class="btn btn-primary" id="passContinue">Devam et</button></div>
  </div>`;
}
function attachPassSummary(){
  const b = document.getElementById('passContinue');
  if(b) b.onclick = ()=> completeStep();
}

/* ---- EŞLEŞTİRME ---- */
function renderMatch(s){
  if(!s.leftShuffled){
    s.leftShuffled = seededShuffle(s.order, s.seed+1);
    s.rightShuffled = seededShuffle(s.order, s.seed+2);
    s.matched = [];
    s.selectedLeft = null;
    s.wrongFlashKey = null;
  }
  const done = s.matched.length === s.order.length;
  let leftHtml = s.leftShuffled.map(w=>{
    const isMatched = s.matched.includes(w.de);
    const isSel = s.selectedLeft===w.de;
    const cls = isMatched? 'correct' : (isSel? 'selected':'');
    return `<div class="match-tile ${cls}" data-key="${w.de}" data-side="left">${w.de}</div>`;
  }).join('');
  let rightHtml = s.rightShuffled.map(w=>{
    const isMatched = s.matched.includes(w.de);
    const wrongFlash = s.wrongFlashKey===w.de;
    const cls = isMatched? 'correct' : (wrongFlash?'wrong':'');
    return `<div class="match-tile ${cls}" data-key="${w.de}" data-side="right">${w.tr[0]}</div>`;
  }).join('');
  return `
  <div class="stage-card" style="align-items:stretch;">
    <span class="hint" style="text-align:center;">Almanca kelimeyi doğru Türkçe anlamıyla eşleştir</span>
    <div class="match-grid">
      <div class="match-col">${leftHtml}</div>
      <div class="match-col">${rightHtml}</div>
    </div>
    <div class="counter" style="text-align:center;">${s.matched.length} / ${s.order.length} eşleşti</div>
    ${done? '<div class="btn-row"><button class="btn btn-primary" id="matchContinue">Devam et</button></div>':''}
  </div>`;
}
function attachMatch(){
  document.querySelectorAll('.match-tile').forEach(el=>{
    el.onclick = ()=>{
      const key = el.dataset.key, side = el.dataset.side;
      const s = session;
      if(s.matched.includes(key)) return;
      if(side==='left'){ s.selectedLeft = key; render(); return; }
      if(side==='right'){
        if(!s.selectedLeft) return;
        if(s.selectedLeft===key){
          s.matched.push(key);
          s.selectedLeft=null;
          render();
        } else {
          s.wrongFlashKey = key;
          render();
          setTimeout(()=>{ s.wrongFlashKey=null; s.selectedLeft=null; render(); }, 500);
        }
      }
    };
  });
  const cont = document.getElementById('matchContinue');
  if(cont) cont.onclick = ()=> completeStep();
}

/* ---- BOŞLUK DOLDURMA ---- */
function buildClozeOptions(word, pool, seed){
  const distractors = seededShuffle(pool.filter(w=>w.de!==word.de), seed).slice(0,3).map(w=>w.de);
  const opts = seededShuffle([word.de, ...distractors], seed+1);
  return opts;
}
function renderCloze(s){
  const words = s.order;
  if(s.idx >= words.length) return renderPassSummary(s);
  const w = words[s.idx];
  const [sentDe] = exampleFor(w);
  const blanked = sentDe.replace(new RegExp(w.de,'i'), '____');
  if(!s.mcOptions || s.mcOptions._for!==w.de){
    const opts = buildClozeOptions(w, s.mod.words, s.seed+s.idx);
    s.mcOptions = opts; s.mcOptions._for = w.de;
    s.mcSelected = null; s.mcResolved=false;
  }
  const optsHtml = s.mcOptions.map(o=>{
    let cls='';
    if(s.mcResolved){
      if(o===w.de) cls='correct';
      else if(o===s.mcSelected) cls='wrong';
    }
    return `<div class="mc-opt ${cls} ${s.mcResolved?'disabled':''}" data-opt="${o}">${o}</div>`;
  }).join('');
  return `
  <div class="stage-card">
    <span class="hint">Cümledeki boşluğa uygun fiili seç</span>
    <div class="word-de" style="font-size:22px;">${blanked}</div>
    <div class="word-tr" style="font-size:14px;">(${w.tr[0]})</div>
    <div class="mc-grid">${optsHtml}</div>
    <div class="counter">${s.idx+1} / ${words.length}</div>
    ${s.mcResolved? '<div class="btn-row"><button class="btn btn-primary" id="clozeNext">Devam et</button></div>':''}
  </div>`;
}
function attachCloze(){
  document.querySelectorAll('.mc-opt').forEach(el=>{
    el.onclick = ()=>{
      if(session.mcResolved) return;
      session.mcSelected = el.dataset.opt;
      session.mcResolved = true;
      const w = session.order[session.idx];
      if(session.mcSelected===w.de) session.correctCount++; else session.wrongCount++;
      render();
    };
  });
  const nxt = document.getElementById('clozeNext');
  if(nxt) nxt.onclick = ()=>{
    session.idx++; session.mcOptions=null;
    render();
  };
}

/* ---- ÖRNEKLER ---- */
function renderExamples(s){
  const words = s.order;
  if(s.idx >= words.length) return renderPassSummary(s);
  const w = words[s.idx];
  const [de,tr] = exampleFor(w);
  return `
  <div class="stage-card">
    <span class="hint">Kelimenin cümle içindeki kullanımını incele</span>
    <div class="word-de" style="font-size:26px;">${w.de}</div>
    <div class="word-tr">${w.tr.join(' / ')}</div>
    <div class="divider-line"></div>
    <div class="example-block">
      <div class="example-de">${de}</div>
      <div class="example-tr">${tr}</div>
    </div>
    <div class="counter">${s.idx+1} / ${words.length}</div>
    <div class="btn-row"><button class="btn btn-primary" id="exNext">${s.idx>=words.length-1?'Bitir':'Sonraki'}</button></div>
  </div>`;
}
function attachExamples(){
  const b = document.getElementById('exNext');
  if(b) b.onclick = ()=>{
    if(session.idx >= session.order.length-1){ completeStep(); return; }
    session.idx++; render();
  };
}

/* ---- MİNİ TEST ---- */
function renderMiniTest(s){
  const words = s.order;
  if(s.idx >= words.length){
    const total = words.length;
    const pct = Math.round((s.correctCount/total)*100);
    const passed = pct>=70;
    return `
    <div class="stage-card">
      <h2 style="font-size:22px;">Mini test sonucu</h2>
      <div class="score-tag" style="color:${passed?'var(--green)':'var(--coral)'}">${s.correctCount}/${total} doğru (%${pct})</div>
      <p class="hint">${passed? 'Bu tekrarı başarıyla tamamladın.' : 'Başarı eşiği %70. Bu mini testi tekrar dene.'}</p>
      <div class="btn-row"><button class="btn btn-primary" id="testContinue">${passed?'Devam et':'Tekrar dene'}</button></div>
    </div>`;
  }
  const w = words[s.idx];
  if(!s.mcOptions || s.mcOptions._for!==w.de){
    const distractors = seededShuffle(s.mod.words.filter(x=>x.de!==w.de), s.seed+s.idx+50).slice(0,3);
    const opts = seededShuffle([w, ...distractors], s.seed+s.idx+51).map(x=>x.tr[0]);
    s.mcOptions = opts; s.mcOptions._for = w.de; s.mcOptions._correct = w.tr[0];
    s.mcSelected=null; s.mcResolved=false;
  }
  const optsHtml = s.mcOptions.map(o=>{
    let cls='';
    if(s.mcResolved){
      if(o===s.mcOptions._correct) cls='correct';
      else if(o===s.mcSelected) cls='wrong';
    }
    return `<div class="mc-opt ${cls} ${s.mcResolved?'disabled':''}" data-opt="${o}">${o}</div>`;
  }).join('');
  return `
  <div class="stage-card">
    <span class="hint">Doğru Türkçe karşılığı seç</span>
    <div class="word-de">${w.de}</div>
    <div class="mc-grid">${optsHtml}</div>
    <div class="counter">${s.idx+1} / ${words.length} &nbsp;·&nbsp; Doğru: ${s.correctCount}</div>
    ${s.mcResolved? '<div class="btn-row"><button class="btn btn-primary" id="testNext">Devam et</button></div>':''}
  </div>`;
}
function attachMiniTest(){
  document.querySelectorAll('.mc-opt').forEach(el=>{
    el.onclick = ()=>{
      if(session.mcResolved) return;
      session.mcSelected = el.dataset.opt;
      session.mcResolved = true;
      if(session.mcSelected===session.mcOptions._correct) session.correctCount++; else session.wrongCount++;
      render();
    };
  });
  const nxt = document.getElementById('testNext');
  if(nxt) nxt.onclick = ()=>{ session.idx++; session.mcOptions=null; render(); };
  const cont = document.getElementById('testContinue');
  if(cont) cont.onclick = ()=>{
    const total = session.order.length;
    const pct = Math.round((session.correctCount/total)*100);
    if(pct>=70){ completeStep(); }
    else {
      // aynı tekrarın mini testini yeniden dene
      session.idx=0; session.correctCount=0; session.wrongCount=0; session.mcOptions=null;
      render();
    }
  };
}

function attachLessonEvents(){
  const back = document.getElementById('backBtn');
  if(back) back.onclick = goList;
  const s = session;
  switch(STAGE_TYPES[s.stageType]){
    case 'HÖM': attachHOM(); break;
    case 'TAHMİN': (s.idx>=s.order.length)?attachPassSummary():attachGuess(s.rep%2===0?'de2tr':'tr2de'); break;
    case 'TERS': (s.idx>=s.order.length)?attachPassSummary():attachGuess(s.rep%2===0?'tr2de':'de2tr'); break;
    case 'EŞLEŞTİRME': attachMatch(); break;
    case 'BOŞLUK DOLDURMA': (s.idx>=s.order.length)?attachPassSummary():attachCloze(); break;
    case 'ÖRNEKLER': attachExamples(); break;
    case 'MİNİ TEST': attachMiniTest(); break;
  }
}

/* ---------------- MODÜL TAMAMLANDI ---------------- */
function renderModuleComplete(){
  const mod = MODULES[CUR_MODULE];
  const nextExists = CUR_MODULE < MODULES.length-1;
  return `
  <div class="complete-wrap">
    <span class="eyebrow">Modül tamamlandı</span>
    <h2>Modül ${CUR_MODULE+1} ✓</h2>
    <p>${mod.words.length} kelimeyi 14 farklı tekrar döngüsünden geçirdin. ${nextExists?'Bir sonraki modül artık açık.':'Tüm modülleri tamamladın!'}</p>
    <div class="btn-row">
      <button class="btn btn-ghost" id="reviewBtn">Bu modülü tekrar incele</button>
      ${nextExists? '<button class="btn btn-primary" id="nextModBtn">Sonraki modüle geç</button>' : ''}
    </div>
  </div>`;
}
function attachCompleteEvents(){
  const rev = document.getElementById('reviewBtn');
  if(rev) rev.onclick = ()=>{ SCREEN='list'; render(); };
  const nxt = document.getElementById('nextModBtn');
  if(nxt) nxt.onclick = ()=>{ CUR_MODULE++; SCREEN='list'; render(); };
}

/* =========================================================
   BAŞLAT
   ========================================================= */
(async function init(){
  await loadProgress();
  SCREEN = 'list';
  render();
})();
</script>
